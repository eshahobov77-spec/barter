# ==========================================================================
#  TXT Barter — nginx konfiguratsiyasi
#
#  BU FAYL FAQAT serverning O'ZIDA (host'da) nginx ishlayotgan bo'lsa kerak.
#  Tekshiring:  systemctl is-active nginx
#  Agar `inactive`/`failed` bo'lsa yoki 80/443 ni Docker konteyneri egallagan bo'lsa —
#  bu faylni ishlatmang. .env da BIND_HOST=0.0.0.0 qo'ying, sayt to'g'ridan-to'g'ri
#  http://SERVER_IP:APP_PORT da ochiladi. Batafsil: deploy/README.md, 0-bo'lim.
#
#  O'rnatish:
#    sudo cp deploy/nginx/barter.conf /etc/nginx/sites-available/barter.conf
#    sudo ln -s /etc/nginx/sites-available/barter.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  DIQQAT: quyidagi ikkita raqamni o'zingiznikiga moslang:
#    • listen 8080      — sayt ochiladigan port (boshqa loyihalar bilan to'qnashmasin)
#    • 127.0.0.1:3210   — .env dagi APP_PORT bilan bir xil bo'lishi shart
# ==========================================================================

upstream barter_app {
    server 127.0.0.1:3210;      # <-- .env dagi APP_PORT
    keepalive 32;
}

server {
    listen 8080;                # <-- sayt shu portda ochiladi: http://SERVER_IP:8080
    listen [::]:8080;

    # Hozircha IP bilan ishlaymiz. Domen ulangach quyidagi qatorni almashtiring:
    #   server_name barter.sizning-domen.uz;
    # va `listen 8080;` o'rniga `listen 80;` qo'ying (80-port band bo'lmasa).
    server_name _;

    # Excel import uchun (fayl 25 MB gacha)
    client_max_body_size 30m;
    client_body_timeout 300s;

    # Loglar — boshqa loyihalarniki bilan aralashmasin
    access_log /var/log/nginx/barter.access.log;
    error_log  /var/log/nginx/barter.error.log;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # Next.js statik fayllari — uzoq muddatli kesh
    location /_next/static/ {
        proxy_pass http://barter_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Healthcheck — monitoring uchun
    location = /api/health {
        proxy_pass http://barter_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://barter_app;
        proxy_http_version 1.1;

        # MUHIM: $http_host (port bilan birga) — aks holda Next.js server action'lari
        # "Invalid Server Actions request" xatosini beradi.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Connection        "";

        # Excel eksport va import uzoq davom etishi mumkin
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # React Server Components oqimi buferlanmasin
        proxy_buffering off;
    }
}

